    <script type="text/babel">
    const { useState, useRef, useCallback, useMemo, useEffect } = React;
    const SCALE=1.8,GRID_SIZE=10,SNAP_SIZE=5;
    const ROOF_TYPES=[{id:"duz",name:"Duz Tavan",desc:"Ayni panelden duz cati"},{id:"besik",name:"Besik Cati",desc:"Cift yonlu egimli cati"},{id:"tek_egim",name:"Tek Egim",desc:"Tek yonlu egimli cati"}];
    const PANEL_TYPES=[{id:"ahsap_pu",name:"Ahsap Desen PU",color:"#D4A574"},{id:"beyaz_pu",name:"Beyaz PU",color:"#F0F0F0"},{id:"tas_pu",name:"Tas Desen PU",color:"#B8B0A0"}];
    const ROOF_COLORS=[{id:"beyaz",name:"Beyaz",color:"#F5F5F5"},{id:"antrasit",name:"Antrasit",color:"#404040"},{id:"bordo",name:"Bordo",color:"#800020"}];
    const DOOR_TYPES=[{id:"dis_sac",name:"Dis Kapi (Sac)",width:88,height:196,type:"dis"},{id:"dis_pvc",name:"Dis Kapi (PVC Camli)",width:88,height:196,type:"dis"},{id:"ic_pvc",name:"Ic Kapi (PVC)",width:80,height:190,type:"ic"},{id:"ic_ahsap",name:"Ic Kapi (Ahsap)",width:80,height:190,type:"ic"},{id:"wc",name:"WC Kapi",width:75,height:190,type:"wc"}];
    const WINDOW_TYPES=[{id:"w100x120",name:"100x120",width:100,height:120,defaultElevation:90},{id:"w100x180",name:"100x180",width:100,height:180,defaultElevation:40},{id:"w150x180",name:"150x180",width:150,height:180,defaultElevation:40},{id:"w50x100",name:"50x100 Vasistas",width:50,height:100,defaultElevation:120}];
    const MARKER_TYPES=[{id:"baca",name:"Baca Deligi",icon:"B",color:"#EF4444"},{id:"havalandirma",name:"Havalandirma",icon:"H",color:"#8B5CF6"},{id:"klima",name:"Klima Yeri",icon:"K",color:"#06B6D4"},{id:"elektrik",name:"Elektrik Panosu",icon:"E",color:"#F59E0B"},{id:"aydinlatma",name:"Aydinlatma",icon:"A",color:"#10B981"},{id:"ozel",name:"Ozel Not",icon:"?",color:"#6B7280"}];
    const DEFAULT_CONTAINER={width:300,length:700,height:230,roofType:"duz",roofColor:"beyaz",panelType:"beyaz_pu",roofLayers:1,hasVeranda:false,roofHeight:35};
    const snapTo=v=>Math.round(v/SNAP_SIZE)*SNAP_SIZE,c2s=cm=>cm*SCALE,s2c=px=>px/SCALE,uid=()=>Math.random().toString(36).substr(2,9);
    // Wall segment calculator: items on a wall sorted by position, gaps calculated
    function calcWallSegments(items, wallLength, wallAxis, containerWidth) {
      // wallAxis: "top"(y~0), "bottom"(y~width), "left"(x~0), "right"(x~length)
      const wallItems = items.filter(i => {
        if (i.type !== "door" && i.type !== "window" && i.type !== "outlet") return false;
        if (wallAxis === "top") return i.y < 20;
        if (wallAxis === "bottom") return i.y > containerWidth - 20;
        if (wallAxis === "left") return i.x < 20;
        if (wallAxis === "right") return i.x > wallLength - 20;
        return false;
      });
      const sorted = wallItems.map(i => {
        const pos = (wallAxis === "left" || wallAxis === "right") ? i.y : i.x;
        const w = i.type === "outlet" ? 10 : i.width || 80;
        return { pos, width: w, item: i };
      }).sort((a, b) => a.pos - b.pos);
      const segs = [];
      let cursor = 0;
      sorted.forEach(s => {

    // ==================== WALL ELEVATION VIEW (2D side view of each wall) ====================
    function WallElevationView({wall,container,items,partitions,wcZones,compact,combo}){
      // wall: "A"(top/front,y~0), "B"(right,x~length), "C"(bottom/back,y~width), "D"(left,x~0)
      // Also supports interior walls: "P-{position}" (partition), "WC-V-{x}" (WC vertical), "WC-H-{y}" (WC horizontal)
      const totalW=combo&&combo.enabled&&combo.direction==="width"?container.width*2:container.width;
      const totalL=combo&&combo.enabled&&combo.direction==="length"?container.length*2:container.length;
      const isExterior=["A","B","C","D"].includes(wall);
      let wallName,wallColor,wLen,wH=container.height,isInterior=false,roofH=container.roofType==="duz"?5:20;
      if(wall==="A"){wallName="A Duvari - On Cephe (Disaridan Bakis)";wallColor="#1565C0";wLen=totalL}
      else if(wall==="B"){wallName="B Duvari - Sag Cephe (Iceriden Bakis)";wallColor="#2E7D32";wLen=totalW}
      else if(wall==="C"){wallName="C Duvari - Arka Cephe (Iceriden Bakis)";wallColor="#E65100";wLen=totalL}
      else if(wall==="D"){wallName="D Duvari - Sol Cephe (Iceriden Bakis)";wallColor="#6A1B9A";wLen=totalW}
      else if(wall.startsWith("P-")){const pos=parseInt(wall.split("-")[1]);const part=partitions.find(p=>p.position===pos);const isHoriz=part&&part.orientation==="horizontal";wallName="Bolme Duvari ("+pos+" cm)";wallColor="#78909C";wLen=isHoriz?totalL:totalW;isInterior=true}
      else if(wall.startsWith("WC-V-")){const pos=parseInt(wall.split("-")[2]);const wc=wcZones.find(z=>z.x===pos||z.x+z.w===pos);wallName="WC Duvari (x="+pos+" cm)";wallColor="#00838F";wLen=wc?wc.h:totalW;isInterior=true}
      else if(wall.startsWith("WC-H-")){const pos=parseInt(wall.split("-")[2]);const wc=wcZones.find(z=>z.y===pos||z.y+z.h===pos);wallName="WC Duvari (y="+pos+" cm)";wallColor="#00838F";wLen=wc?wc.w:totalL;isInterior=true}
      else{wallName=wall;wallColor="#666";wLen=totalL}
      const totalH=isInterior?wH:wH+roofH; // exterior walls show roof on top
      const sc2=compact?0.45:0.55;
      const pad=compact?35:45;
      const dimRowH=compact?14:18;
      const svgW=wLen*sc2+pad*2+30;
      const svgH=totalH*sc2+pad*2+(compact?30:40)+dimRowH*2;
      const wx=v=>v*sc2+pad, wy=v=>svgH-pad-dimRowH*2-v*sc2;
      // Filter items on this wall (use totalW/totalL for combo mode)
      const wallItems=items.filter(i=>{
        if(wall==="A") return i.y>totalW-20;
        if(wall==="C") return i.y<20;
        if(wall==="D") return i.x<20;
        if(wall==="B") return i.x>totalL-20;
        if(wall.startsWith("P-")){const pos=parseInt(wall.split("-")[1]);return Math.abs(i.x-pos)<20&&i.y>20&&i.y<totalW-20}
        if(wall.startsWith("WC-V-")){const pos=parseInt(wall.split("-")[2]);return Math.abs(i.x-pos)<20}
        if(wall.startsWith("WC-H-")){const pos=parseInt(wall.split("-")[2]);return Math.abs(i.y-pos)<20}
        return false;
      });
      const getPos=item=>{
        if(wall==="A"||wall==="C") return item.x;
        if(wall==="B"||wall==="D") return item.y;
        if(wall.startsWith("P-")||wall.startsWith("WC-V-")) return item.y;
        if(wall.startsWith("WC-H-")) return item.x;
        return item.x;
      };
      const getItemW=item=>{if(item.type==="outlet") return 10; return item.width||80;};
      // Build segment dimension data: gaps between items (sorted by position along wall)
      const sortedItems=wallItems.filter(i=>i.type==="door"||i.type==="window"||i.type==="outlet").map(i=>({pos:getPos(i),w:getItemW(i),label:i.type==="door"?(i.width+""):i.type==="window"?(i.width+"x"+(i.windowHeight||120)):"P"})).sort((a,b)=>a.pos-b.pos);
      const segments=[];
      let cursor=0;
      sortedItems.forEach(si=>{
        if(si.pos>cursor) segments.push({from:cursor,to:si.pos,len:si.pos-cursor,isGap:true});
        segments.push({from:si.pos,to:si.pos+si.w,len:si.w,isGap:false,label:si.label});
        cursor=si.pos+si.w;
      });
      if(cursor<wLen) segments.push({from:cursor,to:wLen,len:wLen-cursor,isGap:true});
      // Partitions on this wall (dashed lines on exterior walls - vertical partitions on long walls, horizontal on short walls)
      const partOnWall=(wall==="A"||wall==="C")?partitions.filter(p=>p.orientation!=="horizontal"):(wall==="B"||wall==="D")?partitions.filter(p=>p.orientation==="horizontal"):[];
      // WC zone intersection lines
      const wcLines=[];
      if(wall==="A"||wall==="C"){wcZones.forEach(wc=>{wcLines.push({pos:wc.x,len:wc.w,label:"WC"});wcLines.push({pos:wc.x+wc.w,len:0})})}
      if(wall==="B"||wall==="D"){wcZones.forEach(wc=>{wcLines.push({pos:wc.y,len:wc.h,label:"WC"});wcLines.push({pos:wc.y+wc.h,len:0})})}
      const fs1=compact?7:9, fs2=compact?6:7.5, fs3=compact?5.5:7, fs4=compact?5:6;
      return (
        <svg viewBox={`0 0 ${svgW} ${svgH}`} style={{width:"100%",maxHeight:compact?"220px":"300px",border:"1px solid #e5e7eb",borderRadius:"6px",background:"white"}}>
          <rect x="0" y="0" width={svgW} height={compact?18:22} fill={wallColor} opacity="0.12"/>
          <circle cx={compact?14:18} cy={compact?9:11} r={compact?7:9} fill={wallColor}/>
          <text x={compact?14:18} y={compact?12.5:15} textAnchor="middle" fontSize={fs1} fill="white" fontWeight="bold">{wall.charAt(0)}</text>
          <text x={compact?28:34} y={compact?12.5:15} fontSize={fs1} fill={wallColor} fontWeight="600">{wallName}</text>
          {/* Wall rectangle */}
          <rect x={pad} y={wy(wH)} width={wLen*sc2} height={wH*sc2} fill="#F5F5F5" stroke="#37474F" strokeWidth="2" rx="1"/>
          {/* Roof section on exterior walls */}
          {!isInterior && <g>
            <rect x={pad} y={wy(totalH)} width={wLen*sc2} height={roofH*sc2} fill={ROOF_COLORS.find(r=>r.id===container.roofColor)?.color||"#F5F5F5"} stroke="#37474F" strokeWidth="1.5" rx="1" opacity="0.85"/>
            <line x1={pad} y1={wy(wH)} x2={pad+wLen*sc2} y2={wy(wH)} stroke="#37474F" strokeWidth="1" strokeDasharray="3,2"/>
            <text x={pad+wLen*sc2/2} y={wy(wH+roofH/2)+3} textAnchor="middle" fontSize={fs4} fill="#555" fontWeight="500">Cati ({roofH} cm)</text>
          </g>}
          <line x1={pad-5} y1={wy(0)} x2={pad+wLen*sc2+5} y2={wy(0)} stroke="#795548" strokeWidth="2.5"/>
          {/* Partition intersection lines */}
          {partOnWall.map((p,i)=>{const px=wx(p.position);return (<g key={"ep-"+i}><line x1={px} y1={wy(0)} x2={px} y2={wy(wH*0.92)} stroke="#78909C" strokeWidth="1.5" strokeDasharray="4,3"/><text x={px} y={wy(wH)-4} textAnchor="middle" fontSize={fs4} fill="#546E7A">{p.position}cm</text></g>)})}
          {/* WC zone intersection lines */}
          {wcLines.map((wl,i)=>{const px=wx(wl.pos);return (<g key={"ewc-"+i}><line x1={px} y1={wy(0)} x2={px} y2={wy(wH*0.92)} stroke="#00838F" strokeWidth="1" strokeDasharray="3,3" opacity="0.6"/>{wl.label && <text x={px+2} y={wy(wH*0.92)+10} fontSize={fs4} fill="#00838F">{wl.label}</text>}</g>)})}
          {/* Items */}
          {wallItems.map((item,idx)=>{
            const pos=getPos(item);
            if(item.type==="door"){
              const dw=item.width, dh=item.doorHeight||196;
              const di=DOOR_TYPES.find(d=>d.id===item.doorType);
              const od=item.openDir||"sol",inout=item.openInOut||"ic";
              const arcR=dw*sc2*0.7;

              const opensOut=inout==="dis";

              return (<g key={"we-d-"+idx}>

                <circle cx={opensOut?(hingeLeft?hx-arcR*0.6:hx+arcR*0.6):(hingeLeft?hx+arcR*0.6:hx-arcR*0.6)} cy={arcY-arcR*0.3} r={2} fill={opensOut?"#E65100":"#1565C0"}/>

            }
            if(item.type==="window"){
              const ww=item.width, wh=item.windowHeight, el=item.elevation||90;
              const od=item.openDir||"ic";

                <line x1={wx(pos)+ww*sc2/2} y1={wy(el+wh)} x2={wx(pos)+ww*sc2/2} y2={wy(el)} stroke="#1565C0" strokeWidth="0.5"/>
                <line x1={wx(pos)} y1={wy(el+wh/2)} x2={wx(pos)+ww*sc2} y2={wy(el+wh/2)} stroke="#1565C0" strokeWidth="0.5"/>
                {od==="dis"?

                  <g><line x1={wcx} y1={wcy} x2={wcx} y2={wcy+10} stroke="#1565C0" strokeWidth="1.2" opacity="0.5"/><polygon points={`${wcx-3},${wcy+7} ${wcx+3},${wcy+7} ${wcx},${wcy+12}`} fill="#1565C0" opacity="0.5"/></g>
                }
                <text x={wx(pos)+ww*sc2/2} y={wy(el+wh)-4} textAnchor="middle" fontSize={fs3} fill="#1565C0" fontWeight="600">{ww}x{wh}</text>
                <text x={wx(pos)+ww*sc2+5} y={wy(el+wh/2)+3} fontSize={fs4} fill="#888" fontWeight="500">{od==="dis"?"Disa":"Ice"}</text>
                {/* Elevation dimension line on left side */}
                <line x1={wx(pos)-8} y1={wy(0)} x2={wx(pos)-8} y2={wy(el)} stroke="#F57C00" strokeWidth="0.8" strokeDasharray="2,1"/>
                <line x1={wx(pos)-12} y1={wy(0)} x2={wx(pos)-4} y2={wy(0)} stroke="#F57C00" strokeWidth="0.5"/>
                <line x1={wx(pos)-12} y1={wy(el)} x2={wx(pos)-4} y2={wy(el)} stroke="#F57C00" strokeWidth="0.5"/>
                <text x={wx(pos)-10} y={wy(el/2)+3} textAnchor="end" fontSize={fs4} fill="#F57C00" fontWeight="500">h:{el}</text>
              </g>)
            }
            if(item.type==="outlet"){
              const el=item.elevation||40;
              return (<g key={"we-o-"+idx}>
                <circle cx={wx(pos)+5} cy={wy(el)} r={compact?5:6} fill="#FFF8E1" stroke="#FF9800" strokeWidth="1.2"/>
                <text x={wx(pos)+5} y={wy(el)+2.5} textAnchor="middle" fontSize={fs4} fill="#E65100" fontWeight="bold">P</text>
                <text x={wx(pos)+5} y={wy(el)-8} textAnchor="middle" fontSize={fs4} fill="#F57C00" fontWeight="500">h:{el}</text>
              </g>)
            }
            return null;
          })}
          {/* Segment dimension lines - Layer 1: individual gaps/items */}
          {(()=>{
            const dimY1=wy(0)+dimRowH;
            return segments.map((seg,i)=>{
              const x1=wx(seg.from), x2=wx(seg.to);
              if(seg.len<5) return null;
              return (<g key={"seg-"+i}>
                <line x1={x1} y1={dimY1} x2={x2} y2={dimY1} stroke={seg.isGap?"#C62828":"#1565C0"} strokeWidth={compact?0.8:1}/>
                <line x1={x1} y1={dimY1-3} x2={x1} y2={dimY1+3} stroke={seg.isGap?"#C62828":"#1565C0"} strokeWidth={compact?0.6:0.8}/>
                <line x1={x2} y1={dimY1-3} x2={x2} y2={dimY1+3} stroke={seg.isGap?"#C62828":"#1565C0"} strokeWidth={compact?0.6:0.8}/>
                {seg.len>15 && <text x={(x1+x2)/2} y={dimY1-2} textAnchor="middle" fontSize={fs4} fill={seg.isGap?"#C62828":"#1565C0"} fontWeight="600">{Number.isInteger(seg.len)?seg.len:seg.len.toFixed(1)} cm</text>}
              </g>);
            });
          })()}
          {/* Layer 2: Total wall dimension */}
          {(()=>{
            const dimY2=wy(0)+dimRowH*2;
            return (<g>
              <line x1={pad} y1={dimY2} x2={pad+wLen*sc2} y2={dimY2} stroke="#37474F" strokeWidth={compact?1:1.2}/>
              <line x1={pad} y1={dimY2-4} x2={pad} y2={dimY2+4} stroke="#37474F" strokeWidth={compact?0.8:1}/>
              <line x1={pad+wLen*sc2} y1={dimY2-4} x2={pad+wLen*sc2} y2={dimY2+4} stroke="#37474F" strokeWidth={compact?0.8:1}/>
              <text x={pad+wLen*sc2/2} y={dimY2+12} textAnchor="middle" fontSize={fs2} fill="#37474F" fontWeight="700">{wLen} cm</text>
            </g>);
          })()}
          {/* Height dim on right - wall height */}
          <line x1={pad+wLen*sc2+12} y1={wy(0)} x2={pad+wLen*sc2+12} y2={wy(wH)} stroke="#37474F" strokeWidth={compact?1:1.2}/>
          <line x1={pad+wLen*sc2+8} y1={wy(0)} x2={pad+wLen*sc2+16} y2={wy(0)} stroke="#37474F" strokeWidth={compact?0.8:1}/>
          <line x1={pad+wLen*sc2+8} y1={wy(wH)} x2={pad+wLen*sc2+16} y2={wy(wH)} stroke="#37474F" strokeWidth={compact?0.8:1}/>
          <text x={pad+wLen*sc2+18} y={wy(wH/2)+3} fontSize={fs2} fill="#37474F" fontWeight="600">{wH} cm</text>
          {/* Total height with roof */}
          {!isInterior && <g>
            <line x1={pad+wLen*sc2+24} y1={wy(0)} x2={pad+wLen*sc2+24} y2={wy(totalH)} stroke="#78909C" strokeWidth={compact?0.8:1}/>
            <line x1={pad+wLen*sc2+20} y1={wy(totalH)} x2={pad+wLen*sc2+28} y2={wy(totalH)} stroke="#78909C" strokeWidth={compact?0.6:0.8}/>
            <line x1={pad+wLen*sc2+20} y1={wy(0)} x2={pad+wLen*sc2+28} y2={wy(0)} stroke="#78909C" strokeWidth={compact?0.6:0.8}/>
            <text x={pad+wLen*sc2+30} y={wy(totalH/2)+3} fontSize={fs4} fill="#78909C" fontWeight="500">{totalH} cm</text>
          </g>}
          {/* Extension lines from items to dim line */}
          {wallItems.map((item,idx)=>{const pos=getPos(item);return (<g key={"ext-"+idx}><line x1={wx(pos)} y1={wy(0)+2} x2={wx(pos)} y2={wy(0)+dimRowH-2} stroke="#ddd" strokeWidth="0.5" strokeDasharray="2,2"/></g>)})}
        </svg>
      );
    }

      // SVG to canvas converter for html2canvas compatibility
      const convertSvgsToImages=async(container)=>{
        const svgs=container.querySelectorAll("svg");
        const restoreFns=[];
        for(const svg of svgs){
          try{
            const rect=svg.getBoundingClientRect();
            if(rect.width<1||rect.height<1) continue;
            const clone=svg.cloneNode(true);
            clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
            // Inline computed styles
            const allEls=clone.querySelectorAll("*");
            allEls.forEach(el=>{try{const cs=window.getComputedStyle(svg.querySelector(el.tagName)||svg);if(cs) el.style.cssText=el.style.cssText}catch(e){}});
            const svgStr=new XMLSerializer().serializeToString(clone);
            const blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
            const url=URL.createObjectURL(blob);
            const img=document.createElement("img");
            await new Promise((resolve,reject)=>{
              img.onload=()=>{URL.revokeObjectURL(url);resolve()};
              img.onerror=()=>{URL.revokeObjectURL(url);resolve()};
              img.src=url;
            });
            // Draw to canvas for reliable rendering
            const cvs=document.createElement("canvas");
            cvs.width=rect.width*2;cvs.height=rect.height*2;
            const ctx=cvs.getContext("2d");
            ctx.scale(2,2);
            ctx.drawImage(img,0,0,rect.width,rect.height);
            const imgEl=document.createElement("img");
            imgEl.src=cvs.toDataURL("image/png");
            imgEl.style.width=rect.width+"px";
            imgEl.style.height=rect.height+"px";
            imgEl.style.display="block";
            imgEl.style.maxWidth="100%";
            const parent=svg.parentNode, next=svg.nextSibling;
            parent.replaceChild(imgEl,svg);

                      <button onClick={()=>setPartDir("horizontal")} className={`flex-1 px-2 py-1 rounded text-xs ${partDir==="horizontal"?"bg-blue-100 text-blue-700 font-medium":"bg-gray-100 text-gray-500"}`}>Yatay (Y)</button>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 mb-2">
                      <div>
                        <label className="text-xs text-gray-400">{partDir==="vertical"?"X Konum (cm)":"Y Konum (cm)"}</label>
                        <input type="number" value={partPos} onChange={e=>setPartPos(+e.target.value)} className="w-full border border-gray-300 rounded px-1.5 py-1 text-xs" step="5"/>
                      </div>
                      <div>
                        <label className="text-xs text-gray-400">Baslangic (cm)</label>
                        <input type="number" value={partStart} onChange={e=>setPartStart(+e.target.value)} className="w-full border border-gray-300 rounded px-1.5 py-1 text-xs" step="5" min="0"/>
                      </div>
                    </div>
                    <div className="flex gap-1.5 items-end">
                      <div className="flex-1">
                        <label className="text-xs text-gray-400">Uzunluk (cm)</label>
                        <input type="number" value={partLen} onChange={e=>setPartLen(+e.target.value)} className="w-full border border-gray-300 rounded px-1.5 py-1 text-xs" step="5" min="0"/>
                      </div>
                      <button onClick={()=>setPartitions(p=>[...p,{id:uid(),orientation:partDir,position:partPos,startPos:partStart,length:partLen||0,label:partDir==="vertical"?"Dikey Duvar":"Yatay Duvar"}])} className="px-3 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700">Ekle</button>
                    </div>
                  </div>
                  {partitions.length>0 && <div><div className="text-xs font-semibold text-gray-600 mb-1">Mevcut</div>{partitions.map((p,i)=><div key={i} className="flex justify-between items-center p-1.5 bg-gray-50 rounded text-xs mb-1"><span>{p.label} - {p.position}cm (Bas:{p.startPos||0} Uz:{p.length||"Tam"})</span><button onClick={()=>setPartitions(ps=>ps.filter((_,idx)=>idx!==i))} className="text-red-500 px-1">x</button></div>)}</div>}
                </>}
                {activeTab==="doors" && <><div className="text-xs text-gray-400 mb-1">Secip krokiye yerlestirin.</div>{DOOR_TYPES.map(d=><button key={d.id} onClick={()=>startPlacing({type:"door",doorType:d.id,width:d.width,height:15,doorHeight:d.height,openDir:"sol",openInOut:"ic"})} className={`w-full p-2 rounded border-2 text-left flex justify-between items-center text-xs mb-1.5 ${mode==="place"&&placingItem?.doorType===d.id?"border-blue-500 bg-blue-50":"border-gray-200 hover:border-gray-300"}`}><div><div className="font-medium">{d.name}</div><div className="text-gray-400">{d.width}x{d.height}</div></div><span className="bg-gray-100 px-1.5 py-0.5 rounded">{d.type==="dis"?"Dis":d.type==="wc"?"WC":"Ic"}</span></button>)}{mode==="place"&&placingItem?.type==="door" && <div className="bg-blue-50 border border-blue-200 rounded p-2 text-xs text-blue-700">Tiklayarak yerlestirin. <button onClick={()=>{setMode("select");setPlacingItem(null)}} className="ml-2 px-2 py-0.5 bg-white border border-blue-300 rounded">Iptal</button></div>}</>}
                {activeTab==="windows" && <><div className="text-xs text-gray-400 mb-1">Secip yerlestirin.</div>{WINDOW_TYPES.map(w=><button key={w.id} onClick={()=>startPlacing({type:"window",windowType:w.id,width:w.width,height:10,windowHeight:w.height,elevation:w.defaultElevation,openDir:"ic"})} className={`w-full p-2 rounded border-2 text-left flex justify-between items-center text-xs mb-1.5 ${mode==="place"&&placingItem?.windowType===w.id?"border-blue-500 bg-blue-50":"border-gray-200 hover:border-gray-300"}`}><div><div className="font-medium">{w.name}</div><div className="text-gray-400">{w.width}x{w.height} | Yerden: {w.defaultElevation}cm</div></div>{w.id==="w50x100" && <span className="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-xs">Vasistas</span>}</button>)}{mode==="place"&&placingItem?.type==="window" && <div className="bg-blue-50 border border-blue-200 rounded p-2 text-xs text-blue-700">Tiklayarak yerlestirin. <button onClick={()=>{setMode("select");setPlacingItem(null)}} className="ml-2 px-2 py-0.5 bg-white border border-blue-300 rounded">Iptal</button></div>}</>}
                {activeTab==="extras" && <>
                  <button onClick={()=>startPlacing({type:"outlet",width:10,height:10,elevation:40})} className={`w-full p-2 rounded border-2 text-left text-xs ${mode==="place"&&placingItem?.type==="outlet"?"border-orange-500 bg-orange-50":"border-gray-200 hover:border-gray-300"}`}><div className="font-medium">Priz Ekle</div><div className="text-gray-400">Varsayilan yerden: 40cm</div></button>
                  <button onClick={()=>startPlacing({type:"watertank",width:60,height:40})} className="w-full p-2 rounded border-2 border-gray-200 hover:border-gray-300 text-left text-xs"><div className="font-medium">Su Deposu</div></button>
                  <label className="flex items-center gap-2 p-2 bg-gray-50 rounded cursor-pointer text-xs"><input type="checkbox" checked={container.hasVeranda} onChange={e=>setContainer({...container,hasVeranda:e.target.checked})} className="w-3.5 h-3.5 text-blue-600 rounded"/><span className="font-medium">Veranda</span></label>
                  {mode==="place"&&(placingItem?.type==="outlet"||placingItem?.type==="watertank") && <div className="bg-orange-50 border border-orange-200 rounded p-2 text-xs text-orange-700">Tiklayarak yerlestirin. <button onClick={()=>{setMode("select");setPlacingItem(null)}} className="ml-2 px-2 py-0.5 bg-white border border-orange-300 rounded">Iptal</button></div>}
                </>}
                {activeTab==="markers" && <>
                  <div className="text-xs text-gray-400 mb-2">Isaret koyun, aciklama yazin.</div>
                  {MARKER_TYPES.map(m=><button key={m.id} onClick={()=>startPlacing({type:"marker",markerType:m.id,width:20,height:20,note:m.id==="ozel"?"":m.name})} className={`w-full p-2 rounded border-2 text-left flex items-center gap-2 text-xs mb-1.5 ${mode==="place"&&placingItem?.markerType===m.id?"border-blue-500 bg-blue-50":"border-gray-200 hover:border-gray-300"}`}><span className="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs font-bold" style={{backgroundColor:m.color}}>{m.icon}</span><span className="font-medium">{m.name}</span></button>)}
                  {mode==="place"&&placingItem?.type==="marker" && <div className="bg-blue-50 border border-blue-200 rounded p-2 text-xs text-blue-700 space-y-2"><div>Tiklayarak yerlestirin.</div>{placingItem.markerType==="ozel" && <input type="text" value={markerNote} onChange={e=>{setMarkerNote(e.target.value);setPlacingItem({...placingItem,note:e.target.value})}} className="w-full border border-blue-300 rounded px-2 py-1 text-xs" placeholder="Not yazin..."/>}<button onClick={()=>{setMode("select");setPlacingItem(null);setMarkerNote("")}} className="px-2 py-0.5 bg-white border border-blue-300 rounded">Iptal</button></div>}
                </>}
              </div>
              {/* Selected item detail */}
              {selectedItemData && (
                <div className="border-t border-gray-200 p-3 bg-gray-50 flex-shrink-0 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-semibold text-gray-700">{selectedItemData.type==="door"?"Kapi":selectedItemData.type==="window"?"Pencere":selectedItemData.type==="outlet"?"Priz":selectedItemData.type==="marker"?"Isaret":"Su Dep."}</span>
                    <div className="flex gap-1"><button onClick={()=>handleRotateItem(selectedItem)} className="px-1.5 py-0.5 bg-white border border-gray-300 rounded text-xs">Dondur</button><button onClick={()=>handleDeleteItem(selectedItem)} className="px-1.5 py-0.5 bg-red-50 border border-red-200 rounded text-xs text-red-600">Sil</button></div>
                  </div>
                  <div className="text-xs text-gray-500">Konum: {selectedItemData.x}, {selectedItemData.y} cm</div>
                  {/* Door controls */}
                  {selectedItemData.type==="door" && <>
                    <div className="flex items-center gap-2"><label className="text-xs text-gray-500 w-14">Sol/Sag:</label><div className="flex gap-1">{["sol","sag"].map(d=><button key={d} onClick={()=>updateItemProp(selectedItem,"openDir",d)} className={`px-2 py-0.5 rounded text-xs ${(selectedItemData.openDir||"sol")===d?"bg-blue-100 text-blue-700 font-medium":"bg-gray-100 text-gray-500"}`}>{d==="sol"?"Sola":"Saga"}</button>)}</div></div>
                    <div className="flex items-center gap-2"><label className="text-xs text-gray-500 w-14">Ic/Dis:</label><div className="flex gap-1">{["ic","dis"].map(d=><button key={d} onClick={()=>updateItemProp(selectedItem,"openInOut",d)} className={`px-2 py-0.5 rounded text-xs ${(selectedItemData.openInOut||"ic")===d?"bg-blue-100 text-blue-700 font-medium":"bg-gray-100 text-gray-500"}`}>{d==="ic"?"Ice":"Disa"}</button>)}</div></div>
                  </>}
                  {/* Window controls */}
                  {selectedItemData.type==="window" && <>
                    <div className="flex items-center gap-2"><label className="text-xs text-gray-500 whitespace-nowrap">Yerden:</label><input type="number" value={selectedItemData.elevation||90} onChange={e=>updateItemProp(selectedItem,"elevation",+e.target.value)} className="w-16 border border-gray-300 rounded px-1.5 py-0.5 text-xs" step="5"/><span className="text-xs text-gray-400">cm</span></div>
                    <div className="flex items-center gap-2"><label className="text-xs text-gray-500 w-14">Acilim:</label><div className="flex gap-1">{["ic","dis"].map(d=><button key={d} onClick={()=>updateItemProp(selectedItem,"openDir",d)} className={`px-2 py-0.5 rounded text-xs ${(selectedItemData.openDir||"ic")===d?"bg-blue-100 text-blue-700 font-medium":"bg-gray-100 text-gray-500"}`}>{d==="ic"?"Ice":"Disa"}</button>)}</div></div>
                  </>}
                  {selectedItemData.type==="outlet" && <div className="flex items-center gap-2"><label className="text-xs text-gray-500 whitespace-nowrap">Yerden:</label><input type="number" value={selectedItemData.elevation||40} onChange={e=>updateItemProp(selectedItem,"elevation",+e.target.value)} className="w-16 border border-gray-300 rounded px-1.5 py-0.5 text-xs" step="5"/><span className="text-xs text-gray-400">cm</span></div>}
                  {selectedItemData.type==="marker" && <div><label className="text-xs text-gray-500 block mb-1">Not:</label><input type="text" value={selectedItemData.note||""} onChange={e=>updateItemProp(selectedItem,"note",e.target.value)} className="w-full border border-gray-300 rounded px-2 py-1 text-xs"/></div>}
                </div>
              )}
            </div>
          </div>
          {showExport && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={()=>setShowExport(false)}>
              <div className="bg-white rounded-xl shadow-2xl w-[520px] max-h-[75vh] overflow-hidden" onClick={e=>e.stopPropagation()}>
                <div className="p-4 border-b border-gray-200"><div className="text-base font-bold">Tasarim Ozeti</div></div>
                <div className="p-4 overflow-y-auto max-h-[45vh]"><pre className="bg-gray-50 p-3 rounded text-xs text-gray-700 whitespace-pre-wrap font-mono">{(()=>{
                  const pi2=PANEL_TYPES.find(p=>p.id===container.panelType),ri2=ROOF_TYPES.find(r=>r.id===container.roofType),rc2=ROOF_COLORS.find(r=>r.id===container.roofColor);
                  let t="KONTEYNER: "+container.width+"x"+container.length+"x"+container.height+"cm ("+(container.width*container.length/10000).toFixed(1)+"m2)\nPanel: "+(pi2?.name)+" | Cati: "+(ri2?.name)+" ("+(rc2?.name)+")\n\n";
                  if(wcZones.length){t+="WC: ";wcZones.forEach(w=>t+=w.w+"x"+w.h+"cm("+w.corner+") ");t+="\n"}
                  if(partitions.length){t+="Boluntu: ";partitions.forEach(p=>t+=p.label+"@"+p.position+"cm ");t+="\n"}
                  items.forEach(i=>{if(i.type==="door"){const d=DOOR_TYPES.find(dt=>dt.id===i.doorType);t+="Kapi: "+(d?.name)+" ("+(i.openDir==="sag"?"Saga":"Sola")+","+(i.openInOut==="dis"?"Disa":"Ice")+") @"+i.x+","+i.y+"\n"}if(i.type==="window")t+="Pencere: "+i.width+"x"+i.windowHeight+" h:"+(i.elevation||90)+"cm ("+(i.openDir==="dis"?"Disa":"Ice")+") @"+i.x+","+i.y+"\n";if(i.type==="outlet")t+="Priz: h:"+(i.elevation||40)+"cm @"+i.x+","+i.y+"\n";if(i.type==="marker"){const mi=MARKER_TYPES.find(m=>m.id===i.markerType);t+=(mi?.name)+": "+(i.note||"-")+" @"+i.x+","+i.y+"\n"}});
                  return t;
                })()}</pre></div>
                <div className="p-3 border-t flex justify-end gap-2"><button onClick={()=>setShowExport(false)} className="px-3 py-1.5 bg-blue-600 text-white rounded text-xs">Kapat</button></div>
              </div>
            </div>
          )}
          {showPrint && <PrintView container={container} items={items} partitions={partitions} wcZones={wcZones} combo={combo} veranda={veranda} onClose={()=>setShowPrint(false)}/>}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
    </script>
</body>
</html>
